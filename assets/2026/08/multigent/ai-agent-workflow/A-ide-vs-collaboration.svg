<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <!-- Title -->
  <text x="640" y="56" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">IDE Agent 与协作控制层</text>
  <text x="640" y="92" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="18" fill="#64748B">个人工具 vs 团队/组织可管理的协作对象</text>

  <!-- Left card: IDE Agent -->
  <rect x="80" y="140" width="520" height="520" rx="8" fill="#F7F9FC" stroke="#172033" stroke-width="2" />
  <text x="340" y="184" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">IDE Agent 现状</text>
  <text x="340" y="212" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="14" fill="#64748B">Claude Code · Codex · Cursor</text>

  <!-- Left content boxes -->
  <rect x="120" y="248" width="440" height="56" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" />
  <text x="340" y="276" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="16" fill="#172033">执行:代码补全、文件编辑、命令运行</text>

  <rect x="120" y="324" width="440" height="56" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" />
  <text x="340" y="352" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="16" fill="#172033">上下文:本地会话、私人记忆</text>

  <rect x="120" y="400" width="440" height="56" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" />
  <text x="340" y="428" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="16" fill="#172033">协作:个人生产力、单人流程</text>

  <rect x="120" y="476" width="440" height="56" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" />
  <text x="340" y="504" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="16" fill="#172033">可控:缺少任务、流程、审核、审计</text>

  <text x="340" y="600" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="14" fill="#64748B" font-style="italic">运行结果留在私人对话里</text>

  <!-- Center arrow -->
  <line x1="608" y1="400" x2="672" y2="400" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="384" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="13" fill="#64748B">升级</text>

  <!-- Right card: 协作控制层 -->
  <rect x="680" y="140" width="520" height="520" rx="8" fill="#EAF1FF" stroke="#2563EB" stroke-width="2" />
  <text x="940" y="184" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">协作控制层(在 IDE 之上/之外)</text>
  <text x="940" y="212" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="14" fill="#2563EB">任务 · 流程 · 交接 · 审核 · 审计</text>

  <rect x="720" y="248" width="440" height="56" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
  <text x="940" y="276" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="16" fill="#172033">协作:任务边界、结构化交接</text>

  <rect x="720" y="324" width="440" height="56" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
  <text x="940" y="352" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="16" fill="#172033">流程:节点、暂停/恢复、异常路径</text>

  <rect x="720" y="400" width="440" height="56" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
  <text x="940" y="428" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="16" fill="#172033">控制:权限、人工审核、审计</text>

  <rect x="720" y="476" width="440" height="56" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
  <text x="940" y="504" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="16" fill="#172033">复用:团队记忆、产出可追溯</text>

  <text x="940" y="600" text-anchor="middle" dominant-baseline="middle" font-family="Inter, 'PingFang SC', Arial, sans-serif" font-size="14" fill="#2563EB" font-style="italic">成为可管理、可审计的协作对象</text>
</svg>